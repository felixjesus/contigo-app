<sc-if value="{{ckActive}}" hint-placeholder-val="{{false}}">

<div style="flex: 1 1 280px; min-width: 0; background: #FFFFFF; border: 1px solid #D9DEDA; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<div style="width: 64px; height: 64px; border-radius: 999px; background: #E2EFED; color: #0E5C55; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700">CR</div>
<div style="font-size: 22px; font-weight: 700">Carmen Rojas</div>
<div style="font-size: 15px; color: #4A5755">6 años · Albergue Centro Deportivo</div>
<div style="font-size: 14px; color: #145A37; font-weight: 700">✓ Identificado con su pulsera</div>
<div style="font-size: 14px; color: #4A5755; line-height: 1.4; padding-top: 8px; border-top: 1px solid #ECEFED">{{ckInstruction}}</div>
</div>
<div style="flex: 999 1 420px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<sc-for list="{{measures}}" as="m" hint-placeholder-count="5">
<div style="{{m.cardStyle}}">
<div style="font-size: 16px; color: #4A5755">{{m.name}}</div>
<div style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 40px; font-weight: 700; line-height: 1">{{m.value}}</span><span style="font-size: 17px; color: #4A5755">{{m.unit}}</span></div>
<div style="{{m.chipStyle}}">{{m.chip}}</div>
</div>
</sc-for>
</div>
</div>
<sc-if value="{{ckMeasuring}}" hint-placeholder-val="{{false}}">
<div style="display: flex; justify-content: flex-end">
<button onClick="{{measureNext}}" style="min-height: 64px; padding: 0 36px; border-radius: 16px; border: none; background: #0E5C55; color: #FFFFFF; font-size: 20px; font-weight: 700; cursor: pointer">{{ckButton}}</button>
</div>
</sc-if>
<sc-if value="{{ckDone}}" hint-placeholder-val="{{false}}">
<div style="background: #FFF4DE; border: 2px solid #E8C27A; border-radius: 16px; padding: 18px 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
<div style="flex: 1 1 360px; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 22px; font-weight: 700; color: #6B4A0F">Alerta amarilla · temperatura alta</div>
<div style="font-size: 16px; color: #3D2B08">1,6 °C más que su línea de base de ayer. Repetir la medición en 2 horas.</div>
</div>
<button onClick="{{notifyPromoter}}" style="min-height: 56px; padding: 0 22px; border-radius: 14px; border: none; background: #B7791F; color: #FFFFFF; font-size: 17px; font-weight: 700; cursor: pointer">{{notifyLabel}}</button>
<button onClick="{{resetCheckin}}" style="min-height: 56px; padding: 0 22px; border-radius: 14px; border: 2px solid #0E5C55; background: #FFFFFF; color: #0E5C55; font-size: 17px; font-weight: 700; cursor: pointer">Siguiente niño →</button>
</div>
</sc-if>
</sc-if>
</div>
</sc-if>

<sc-if value="{{isPromotor}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start">
<div style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 14px; font-weight: 700; color: #4A5755; letter-spacing: 0.05em">ALERTAS ABIERTAS · ALBERGUE A</div>
<sc-for list="{{alerts}}" as="a" hint-placeholder-count="3">
<div style="{{a.cardStyle}}">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px"><div style="font-size: 18px; font-weight: 700">{{a.who}}</div><div style="{{a.chipStyle}}">{{a.lvl}}</div></div>
<div style="font-size: 16px; color: #33403E; line-height: 1.4">{{a.txt}}</div>
<sc-if value="{{a.open}}" hint-placeholder-val="{{true}}">
<button onClick="{{a.act}}" style="{{a.btnStyle}}">{{a.action}}</button>
</sc-if>
<sc-if value="{{a.done}}" hint-placeholder-val="{{false}}">
<div style="font-size: 15px; color: #145A37; font-weight: 700">✓ {{a.doneText}}</div>
</sc-if>
</div>
</sc-for>
</div>
<sc-if value="{{showProtocol}}" hint-placeholder-val="{{false}}">
<div style="flex: 1 1 280px; min-width: 0; background: #FFFFFF; border: 2px solid #E4A39C; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 19px; font-weight: 700; color: #8F1D14">Protocolo de búsqueda · Niño/a 063</div>
<div style="font-size: 15px; line-height: 1.5">1. Buscar en todo el albergue y áreas comunes.<br>2. Preguntar a su familia o adulto responsable.<br>3. Revisar traslados, permisos y salidas registradas.<br>4. Día 2 sin check-in: avisar a protección de la infancia.</div>
<sc-if value="{{escalated}}" hint-placeholder-val="{{false}}">
<div style="padding: 10px 12px; border-radius: 10px; background: #FDE7E5; color: #8F1D14; font-size: 14px; font-weight: 700">Aviso enviado a protección de la infancia y al coordinador · queda en el expediente</div>
</sc-if>
<button onClick="{{escalate}}" style="min-height: 48px; border-radius: 12px; border: none; background: #B42318; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer">Avisar a protección de la infancia</button>
<button onClick="{{foundChild}}" style="min-height: 48px; border-radius: 12px; border: 2px solid #0E5C55; background: #FFFFFF; color: #0E5C55; font-size: 16px; font-weight: 700; cursor: pointer">Niño encontrado: hacer check-in</button>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{isExpediente}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start">
<div style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<div style="background: #FFFFFF; border: 1px solid #D9DEDA; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 22px; font-weight: 700">Niño/a 102 · 9 años</div>
<div style="font-size: 14px; color: #4A5755">Ingreso: 26 jun 2026 · Albergue B</div>
<div style="font-size: 14px; color: #4A5755">Nivel de atención: <strong style="color: #6B4A0F">Amarillo</strong></div>
<div style="font-size: 14px; color: #4A5755">Terapia: 3 de 8 sesiones</div>
</div>
<div style="background: #FFFFFF; border: 1px solid #D9DEDA; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 16px; font-weight: 700">Nueva entrada desde la tableta</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{noteTypes}}" as="t" hint-placeholder-count="3">
<button onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
<label for="nota" style="font-size: 13px; color: #4A5755">Escribe lo que observaste</label>
<textarea id="nota" value="{{draft}}" onChange="{{onDraft}}" placeholder="Ej.: hoy participó en la actividad grupal..." style="min-height: 96px; border-radius: 10px; border: 1px solid #C9D1CE; padding: 10px; font-family: inherit; font-size: 15px; resize: vertical"></textarea>
<button onClick="{{saveNote}}" style="min-height: 48px; border-radius: 12px; border: none; background: #0E5C55; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer">Guardar y firmar</button>
<div style="font-size: 12px; color: #4A5755; line-height: 1.4">Nada se borra: las correcciones se agregan como adendas.</div>
</div>
</div>
<div style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 14px; font-weight: 700; color: #4A5755; letter-spacing: 0.05em">LÍNEA DE TIEMPO</div>
<sc-for list="{{notes}}" as="n" hint-placeholder-count="4">
<article style="background: #FFFFFF; border: 1px solid #D9DEDA; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; gap: 8px; align-items: center"><span style="{{n.tagStyle}}">{{n.tag}}</span><span style="font-size: 13px; color: #4A5755">{{n.when}}</span></div>
<div style="font-size: 16px; line-height: 1.45">{{n.text}}</div>
<div style="font-size: 12px; color: #4A5755">{{n.sign}}</div>
</article>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{isRutina}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start">
<div style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 20px; font-weight: 700">Rutina de la mañana · Niño/a 088</div>
<sc-if value="{{changeOn}}" hint-placeholder-val="{{false}}">
<div style="padding: 12px 14px; border-radius: 12px; background: #EEF0FF; color: #2E3A8C; font-size: 15px; font-weight: 700">Cambio avisado en su Go: hoy el recreo será dentro del salón.</div>
</sc-if>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="6">
<div style="{{s.style}}">
<svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"><path d="{{s.d}}" fill="none" stroke="#33403E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<div style="font-size: 17px; font-weight: 700">{{s.name}}</div>
<div style="{{s.tagStyle}}">{{s.tag}}</div>
</div>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button onClick="{{toggleChange}}" style="flex: 1 1 180px; min-height: 56px; border-radius: 14px; border: 2px solid #0E5C55; background: #FFFFFF; color: #0E5C55; font-size: 16px; font-weight: 700; cursor: pointer">Avisar de un cambio</button>
<button onClick="{{toggleCalm}}" style="flex: 1 1 180px; min-height: 56px; border-radius: 14px; border: 2px solid #0E5C55; background: #FFFFFF; color: #0E5C55; font-size: 16px; font-weight: 700; cursor: pointer">{{calmLabel}}</button>
<button onClick="{{completeStep}}" style="flex: 1 1 180px; min-height: 56px; border-radius: 14px; border: none; background: #0E5C55; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer">Paso completado ✓</button>
</div>
<button onClick="{{resetRoutine}}" style="align-self: flex-start; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #C9D1CE; background: #FFFFFF; font-size: 14px; cursor: pointer">Reiniciar rutina</button>
</div>
<div style="flex: 1 1 280px; min-width: 0; background: #FFFFFF; border: 1px solid #D9DEDA; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="align-self: flex-start; font-size: 15px; font-weight: 700; color: #4A5755">Así se ve en su NeuroTouch Go</div>
<div style="width: 220px; height: 220px; border-radius: 999px; background: #14211F; border: 6px solid #E7A3BE; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
<div style="{{goFaceStyle}}">
<div style="font-size: 12px; font-weight: 700; color: #1C4FA8; letter-spacing: 0.08em">{{goLabel}}</div>
<svg width="52" height="52" viewBox="0 0 24 24" aria-hidden="true"><path d="{{goIcon}}" fill="none" stroke="#1C4FA8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<div style="font-size: 20px; font-weight: 700; color: #14211F; text-align: center; padding: 0 12px">{{goNow}}</div>
<div style="font-size: 12px; color: #33403E">{{goNext}}</div>
</div>
</div>
<div style="font-size: 14px; color: #4A5755; text-align: center; line-height: 1.4">{{routineLog}}</div>
</div>
</div>
</sc-if>

<sc-if value="{{isAac}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: #FFFFFF; border: 2px solid #0E5C55; border-radius: 16px; padding: 12px 14px; min-height: 64px; box-sizing: border-box">
<div style="flex: 1 1 220px; font-size: 24px; font-weight: 700; color: {{sentenceColor}}">{{sentence}}</div>
<button onClick="{{speak}}" style="min-height: 52px; padding: 0 22px; border-radius: 12px; border: none; background: #0E5C55; color: #FFFFFF; font-size: 17px; font-weight: 700; cursor: pointer">Hablar</button>
<button onClick="{{clearSentence}}" style="min-height: 52px; padding: 0 18px; border-radius: 12px; border: 1px solid #C9D1CE; background: #FFFFFF; font-size: 16px; cursor: pointer">Borrar</button>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 10px">
<sc-for list="{{tiles}}" as="p" hint-placeholder-count="12">
<button onClick="{{p.tap}}" aria-label="{{p.w}}" style="{{p.style}}">
<svg width="46" height="46" viewBox="0 0 24 24" aria-hidden="true"><path d="{{p.d}}" fill="none" stroke="{{p.color}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="font-size: 16px; font-weight: 700; color: #14211F">{{p.w}}</span>
</button>
</sc-for>
</div>
<div style="font-size: 14px; color: #4A5755">NeuroTouch funciona sin internet. Con consentimiento de la familia, lo que el niño comunica se resume en su expediente. {{aacLog}}</div>
</div>
</sc-if>

<sc-if value="{{isCenso}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start">
<div style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px">
<div style="background: #FFFFFF; border: 1px solid #D9DEDA; border-radius: 14px; padding: 14px"><div style="font-size: 14px; color: #4A5755">Albergue A</div><div style="font-size: 24px; font-weight: 700">108 de 112</div><div style="font-size: 13px; color: #8F1D14; font-weight: 700">4 sin check-in</div></div>
<div style="background: #FFFFFF; border: 1px solid #D9DEDA; border-radius: 14px; padding: 14px"><div style="font-size: 14px; color: #4A5755">Albergue B</div><div style="font-size: 24px; font-weight: 700">95 de 98</div><div style="font-size: 13px; color: #6B4A0F; font-weight: 700">3 sin check-in</div></div>
<div style="background: #FFFFFF; border: 1px solid #D9DEDA; border-radius: 14px; padding: 14px"><div style="font-size: 14px; color: #4A5755">Escuela C</div><div style="font-size: 24px; font-weight: 700">74 de 76</div><div style="font-size: 13px; color: #4A5755">2 con permiso</div></div>
</div>
<div style="font-size: 14px; font-weight: 700; color: #4A5755; letter-spacing: 0.05em">TRASLADOS</div>
<sc-for list="{{transfers}}" as="tr" hint-placeholder-count="2">
<div style="{{tr.style}}">
<div style="display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap"><div style="font-size: 17px; font-weight: 700">{{tr.who}}</div><div style="{{tr.statusStyle}}">{{tr.status}}</div></div>
<div style="font-size: 15px">{{tr.route}}</div>
<sc-if value="{{tr.pending}}" hint-placeholder-val="{{false}}">
<button onClick="{{tr.confirm}}" style="align-self: flex-start; min-height: 44px; padding: 0 14px; border-radius: 10px; border: none; background: #0E5C55; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer">Confirmar llegada (escanear QR)</button>
</sc-if>
</div>
</sc-for>
</div>
<div style="flex: 1 1 280px; min-width: 0; background: #FFFFFF; border: 1px solid #D9DEDA; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 18px; font-weight: 700">Registrar un traslado</div>
<label for="nino" style="font-size: 14px; font-weight: 700">Niño</label>
<select id="nino" value="{{trChild}}" onChange="{{onTrChild}}" style="min-height: 44px; border-radius: 10px; border: 1px solid #C9D1CE; padding: 0 10px; font-family: inherit; font-size: 15px; background: #FFFFFF">
<option value="088">Niño/a 088 · 5 años · Albergue A</option>
<option value="014">Niño/a 014 · 6 años · Albergue A</option>
<option value="102">Niño/a 102 · 9 años · Albergue B</option>
</select>
<label for="dest" style="font-size: 14px; font-weight: 700">Destino</label>
<select id="dest" value="{{trDest}}" onChange="{{onTrDest}}" style="min-height: 44px; border-radius: 10px; border: 1px solid #C9D1CE; padding: 0 10px; font-family: inherit; font-size: 15px; background: #FFFFFF">
<option value="Escuela receptora C">Escuela receptora C</option>
<option value="Albergue B">Albergue B</option>
<option value="Albergue A">Albergue A</option>
<option value="Salida: reunificación familiar">Salida: reunificación familiar</option>
</select>
<div style="font-size: 13px; color: #4A5755; line-height: 1.4">Autoriza: tu usuario verificado. El destino debe confirmar la llegada en 24 horas.</div>
<button onClick="{{registerTransfer}}" style="min-height: 48px; border-radius: 12px; border: none; background: #0E5C55; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer">Registrar traslado</button>
</div>
</div>
</sc-if>

<sc-if value="{{isEnte}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start">
<div style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px">
<div style="background: #FFFFFF; border: 1px solid #D9DEDA; border-radius: 14px; padding: 14px"><div style="font-size: 13px; color: #4A5755">Niños inscritos</div><div style="font-size: 28px; font-weight: 700">286</div></div>
<div style="background: #FFFFFF; border: 1px solid #D9DEDA; border-radius: 14px; padding: 14px"><div style="font-size: 13px; color: #4A5755">Check-in hoy</div><div style="font-size: 28px; font-weight: 700">277</div></div>
<div style="background: #FFFFFF; border: 1px solid #D9DEDA; border-radius: 14px; padding: 14px"><div style="font-size: 13px; color: #4A5755">En terapia</div><div style="font-size: 28px; font-weight: 700">41</div></div>
<div style="background: #FFFFFF; border: 1px solid #D9DEDA; border-radius: 14px; padding: 14px"><div style="font-size: 13px; color: #4A5755">Alertas rojas</div><div style="font-size: 28px; font-weight: 700; color: #B42318">3</div></div>
</div>
<label for="buscar" style="font-size: 14px; font-weight: 700">Buscar un niño por nombre</label>
<input id="buscar" type="text" value="{{query}}" onChange="{{onQuery}}" placeholder="Ej.: Pedro" style="min-height: 44px; border-radius: 10px; border: 1px solid #C9D1CE; padding: 0 12px; font-family: inherit; font-size: 15px">
<div style="background: #FFFFFF; border: 1px solid #D9DEDA; border-radius: 14px; overflow: hidden">
<sc-for list="{{kids}}" as="k" hint-placeholder-count="6">
<button onClick="{{k.pick}}" style="{{k.style}}">
<span style="font-weight: 700">{{k.name}} · {{k.age}} años</span>
<span style="color: #4A5755">{{k.shelter}}</span>
<span style="{{k.levelStyle}}">{{k.estado}}</span>
</button>
</sc-for>
</div>
</div>
<div style="flex: 1 1 280px; min-width: 0; background: #FFFFFF; border: 1px solid #D9DEDA; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<sc-if value="{{hasKid}}" hint-placeholder-val="{{false}}">
<div style="font-size: 13px; font-weight: 700; color: #0E5C55; letter-spacing: 0.05em">FICHA DEL NIÑO</div>
<div style="font-size: 22px; font-weight: 700">{{kid.name}}</div>
<div style="font-size: 15px; line-height: 1.7">Edad: {{kid.age}} años<br>Ingreso: {{kid.ingreso}}<br>Ubicación: {{kid.shelter}}<br>Estado: {{kid.estado}}<br>Nivel de atención: {{kid.nivel}}<br>Último check-in: {{kid.checkin}}<br>Terapia: {{kid.terapia}}<br>Registros anecdóticos: {{kid.anec}}</div>
<div style="font-size: 12px; color: #4A5755">Tu consulta quedó registrada en la bitácora de accesos.</div>
</sc-if>
<sc-if value="{{noKid}}" hint-placeholder-val="{{true}}">
<div style="font-size: 16px; color: #4A5755; line-height: 1.5">Toca un niño de la lista para ver su ficha completa: edad, ingreso, estado, terapias y registros, desde su llegada hasta hoy.</div>
</sc-if>
</div>
</div>
</sc-if>

<sc-if value="{{isTerapeutas}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start">
<div style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<sc-if value="{{inSession}}" hint-placeholder-val="{{false}}">
<div style="background: #14211F; color: #FFFFFF; border-radius: 16px; padding: 16px 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px">
<svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.6"></rect><path d="M16 10l5-3v10l-5-3" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"></path></svg>
<div style="flex: 1 1 300px; display: flex; flex-direction: column; gap: 2px"><div style="font-size: 18px; font-weight: 700">{{sessionTitle}}</div><div style="font-size: 14px; opacity: 0.85">Videollamada desde la tableta del albergue · la plataforma registra inicio y fin</div></div>
<button onClick="{{endSession}}" style="min-height: 48px; padding: 0 18px; border-radius: 12px; border: none; background: #FFFFFF; color: #14211F; font-size: 16px; font-weight: 700; cursor: pointer">Terminar y firmar</button>
</div>
</sc-if>
<div style="font-size: 14px; font-weight: 700; color: #4A5755; letter-spacing: 0.05em">AGENDA DE HOY</div>
<sc-for list="{{sessions}}" as="se" hint-placeholder-count="3">
<div style="background: #FFFFFF; border: 1px solid #D9DEDA; border-radius: 14px; padding: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<div style="font-size: 18px; font-weight: 700; width: 92px">{{se.time}}</div>

<script>
(function () {
  var root = document.getElementById('app');
  var tplEl = document.getElementById('contigo-tpl');
  var comp = null, pending = false;
  var RAW = /^\{\{\s*([^}]+?)\s*\}\}$/;
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function resolve(path, scopes) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.');
    for (var i = scopes.length - 1; i >= 0; i--) {
      var sc = scopes[i];
      if (sc && Object.prototype.hasOwnProperty.call(sc, parts[0])) {
        var v = sc[parts[0]];
        for (var j = 1; j < parts.length; j++) { if (v == null) return undefined; v = v[parts[j]]; }
        return v;
      }
    }
    return undefined;
  }
  function interp(str, scopes) {
    return str.replace(HOLE, function (_, p) { var v = resolve(p, scopes); return v == null ? '' : String(v); });

    const arrow = (cur, prev, upGood) => {
      if (prev === undefined || prev === null || cur === undefined) return ['', ''];
      const d = Math.round((cur - prev) * 10) / 10;
      if (d === 0) return ['=', 'color: #4A5755; font-weight: 700'];

        over: { pad: { title: 'Vínculo con su familia', pos: 'Habla con su madre y su hermana por llamada', neg: 'Pregunta con angustia por su madre', short: 'Vínculo con su familia' } },

        dips: {}, gaps: [],
        over: { com: { title: 'Comunicación (NeuroTouch y gestos)', pos: 'Se comunica con pictogramas o gestos', neg: 'Llanto o frustración al no poder expresarse', short: 'Comunicación con NeuroTouch' }, pad: { title: 'Vínculo con su madre', pos: 'Busca a su madre para jugar y calmarse', neg: 'Se angustia al separarse de su madre', short: 'Vínculo con su madre' } },
        obs: ['La comunicación es el área con mayor avance: pasó de casi no expresarse a usar 14 pictogramas al día.', 'Menos llanto y frustración a medida que puede pedir lo que necesita.', 'La interacción con otros niños sigue baja: es esperable mientras avanza la evaluación de autismo.', 'Su recuperación nutricional coincide con mejor ánimo y mejor sueño.'],

      pedro: {
        tr: { cond: [1.9, 3.2, 4.0, 2.6], emo: [1.4, 3.0, 4.6, 2.9], soc: [1.3, 2.9, 4.5, 2.7], sue: [1.5, 3.1, 4.4, 2.6], com: [1.6, 3.2, 3.9, 2.4], pad: [1.2, 3.0, 4.7, 2.5] },
        dips: { 15: 0.8, 16: 0.3 }, gaps: [13, 14],
        over: {},
        obs: ['Duelo por la muerte de sus padres: al inicio evitaba hablar de ellos y se aislaba.', 'Su ausencia del 4 y 5 oct se reflejó en una caída al regresar; desde entonces mejora.', 'Empieza a hablar de sus padres con recuerdos tranquilos, sobre todo desde que se localizó a su abuela.', 'Sigue siendo el caso más frágil: se mantiene psicología semanal y un acompañante fijo.'],
        concl: 'Evolución positiva pero frágil. Prioridad: preparar con cuidado la reunificación con su abuela y evaluar el GPS de su pulsera.'
      }
    };
    const ip = INT[cs0.id];
    const c1 = (v) => Math.max(1, Math.min(5, Math.round(v * 10) / 10));
    const PX = (i) => 58 + i * (254 / 19);
    const PY = (v) => 20 + (5 - v) * 32;
    const yTicks = [5, 4, 3, 2, 1].map((v) => ({ y: PY(v), ty: PY(v) + 3.5, label: String(v) }));
    const xTicks = [[0, '21 sep'], [7, '28 sep'], [14, '5 oct'], [19, '10 oct']].map((t) => ({ x: PX(t[0]), label: t[1] }));
    const domains = DOMS.map((dm0, di) => {
      const dm = Object.assign({}, dm0, ip.over[dm0.key] || {});
      const t = ip.tr[dm.key];
      const pos = [], neg = [];
      for (let i = 0; i < 20; i++) {
        if (ip.gaps.indexOf(i) !== -1) { pos.push(null); neg.push(null); continue; }

        pos.push(c1(lin(t[0], t[1], i) - dip + wave(30 + di, i, 0.18)));

          if (v === null) { pen = false; return; }

          pen = true;

        });

      };

        trend: better ? '▲ Mejora' : '= Estable',

      };
    });
    const sumRows = domains.map((d) => {
      const ch = d.last - d.first;
      return {
        label: d.short,
        val: nf(d.last, 1) + '/5',
        barStyle: 'display: block; height: 12px; border-radius: 6px; background: #1F5FD1; width: ' + Math.round(d.last / 5 * 100) + '%',

    const profRow = cs0.ficha.find((f) => f[0] === 'Profesionales del caso');
    const sitStyleFor = (c) => 'align-self: flex-start; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; ' + (c.alone ? 'background: #FDE7E5; color: #8F1D14' : 'background: #E3F2E9; color: #145A37');

    return {

      homeCards: homeCards,
      isHome: s.screen === 'home',
      isCheckin: s.screen === 'checkin',

      isExpediente: s.screen === 'expediente',

        this.setState({ sessions: list, session: null, notes: [entry].concat(s.notes) });

      kids: kids,
      kid: kid || {},
      hasKid: !!kid,

    };
  }
